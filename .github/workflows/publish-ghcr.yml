name: Publish image to GHCR

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - ".github/workflows/**"
      - "docs/**"
      - "README.md"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for image publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/princinv/homepage-geoip-heatmap:latest
            ghcr.io/princinv/homepage-geoip-heatmap:${{ github.sha }}
            ghcr.io/princinv/homepage-geoip-heatmap:${{ steps.meta.outputs.short_sha }}

  deploy:
    needs: build-and-push
    uses: ./.github/workflows/deploy-homepage-geoip-heatmap.yml
    with:
      image_tag: ${{ github.sha }}
    secrets: inherit
