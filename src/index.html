<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoIP Heatmap</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">

  <style>
    :root {
      --bg: #0b0f14;
      --border: rgba(255,255,255,0.12);
      --pill-bg: rgba(0,0,0,0.55);
      --pill-border: rgba(255,255,255,0.12);
      --pill-text: #cfd8e3;
      --country-stroke: #6b7788;
      --country-stroke-active: #cfd8e3;
      --country-fill-idle: #1a2230;
    }
  
    :root[data-theme="light"] {
      --bg: #f4f6f8;
      --border: rgba(0,0,0,0.12);
      --pill-bg: rgba(255,255,255,0.85);
      --pill-border: rgba(0,0,0,0.12);
      --pill-text: #1a2230;
      --country-stroke: rgba(26,34,48,0.35);
      --country-stroke-active: rgba(26,34,48,0.70);
      --country-fill-idle: rgba(26,34,48,0.06);
    }
  
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
  
      /* Window border */
      box-sizing: border-box;
      border: 2px solid var(--border);
      overflow: hidden; /* prevents tiny scrollbars */
    }
  
    *, *::before, *::after { box-sizing: inherit; }
  
    #map {
      height: 100%;
      width: 100%;
    }
  
    .leaflet-control-attribution { display: none; }
    .leaflet-control-container .leaflet-top.leaflet-left { display: none; }
    .leaflet-control-container .leaflet-top.leaflet-right { display: none; }
    .leaflet-control-container .leaflet-bottom.leaflet-left { display: none; }
  
    /* Small debug pill */
    #debug {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 9999;
      font: 12px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif;
      color: var(--pill-text);
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      border-radius: 10px;
      padding: 8px 10px;
      max-width: 70vw;
      white-space: pre-wrap;
    }

    /* HUD overlay */
    #hud {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 9999;
    
      color: var(--pill-text);
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      border-radius: 12px;
      padding: 10px 12px;
    
      font: 12px/1.25 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif;
      max-width: min(420px, calc(100vw - 24px));
    }
    
    #hud .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 2px 0;
    }
    
    #hud .muted { opacity: 0.85; }
    #hud .sep { height: 1px; background: var(--pill-border); margin: 8px 0; }
    #hud .toplist { margin: 0; padding-left: 16px; }
    #hud .toplist li { margin: 2px 0; }

    /* HUD toggle pill */
    #hudToggle {
      position: absolute;
      right: 12px;
      bottom: 92px; /* above windowSelect (52px) */
      z-index: 9999;
      font: 12px/1 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif;
      color: var(--pill-text);
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      user-select: none;
    }
    #hudToggle:hover { filter: brightness(1.08); }
    #hudToggle:active { transform: translateY(1px); }

    /* Theme toggle pill */
    #themeToggle {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 9999;
      font: 12px/1 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif;
      color: var(--pill-text);
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      user-select: none;
    }
  
    #themeToggle:hover { filter: brightness(1.08); }
    #themeToggle:active { transform: translateY(1px); }

    /* Time window selector pill */
    #windowSelect {
      position: absolute;
      right: 12px;
      bottom: 52px; /* sits above the theme toggle */
      z-index: 9999;
      font: 12px/1 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif;
      color: var(--pill-text);
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      border-radius: 10px;
      padding: 7px 10px;
      cursor: pointer;
      outline: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="debug">booting…</div>
  <div id="hud" aria-label="Stats HUD"></div>

  <select id="windowSelect" aria-label="Time window">
    <option value="1h">1h</option>
    <option value="6h">6h</option>
    <option value="24h">24h</option>
    <option value="7d">7d</option>
    <option value="30d">30d</option>
  </select>

  <button id="themeToggle" type="button" aria-label="Toggle theme">auto</button>

  <button id="hudToggle" type="button" aria-label="Toggle HUD">hud</button>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

  <script>
    const Q = getQuery();

    const dbg = (msg) => {
      if (!Q.showDebug) return;
      const el = document.getElementById('debug');
      if (el) el.textContent = msg;
      console.log('[debug]', msg);
    };

    function getQuery() {
      const p = new URLSearchParams(window.location.search || '');
      const raw = (p.get('mode') || '').toLowerCase();
      const mode = raw || 'full'; // <- IMPORTANT
    
      return {
        mode,
        showDebug: mode !== 'clean' && mode !== 'map-only',
        showThemeToggle: mode !== 'clean' && mode !== 'map-only',
        showHud: mode === 'full',
        showLegend: mode === 'full',
        mapOnly: mode === 'map-only',
    
        window: p.get('window') || null,
        theme: p.get('theme') || null,
        refresh: p.get('refresh') || null,
      };
    }
    
    function setVisible(id, on) {
      const el = document.getElementById(id);
      if (!el) return;
      el.style.display = on ? '' : 'none';
    }
    
    setVisible('debug', Q.showDebug);
    setVisible('themeToggle', Q.showThemeToggle);
    
    // TODO: If you later add a HUD div like <div id="hud"></div>:
    setVisible('hud', Q.showHud);
    // TODO: If you later add a legend div like <div id="legend"></div>:
    setVisible('legend', Q.showLegend);

    const HUD_KEY = 'geoip_hud_enabled'; // remembers hud toggle
    
    function isHudEnabledDefault() {
      // Use your mode logic as the default behavior
      return !!Q.showHud;
    }
    
    function getHudEnabled() {
      const raw = localStorage.getItem(HUD_KEY);
      if (raw === null) return isHudEnabledDefault(); // no saved pref yet
      return raw === '1';
    }
    
    function setHudEnabled(on) {
      localStorage.setItem(HUD_KEY, on ? '1' : '0');
      setVisible('hud', on);
      const btn = document.getElementById('hudToggle');
      if (btn) btn.textContent = on ? 'hud' : 'hud off';
    }
    
    // init
    setHudEnabled(getHudEnabled());
    
    // toggle handler
    const hudBtn = document.getElementById('hudToggle');
    if (hudBtn) {
      hudBtn.addEventListener('click', () => {
        setHudEnabled(!getHudEnabled());
      });
    }

    const THEME_KEY = 'geoip_theme_mode'; // remembers user's choice
    const WINDOW_KEY = 'geoip_time_window'; // remembers selected time window

    function getWindow() {
      const sel = document.getElementById('windowSelect');
      return sel ? sel.value : '24h';
    }

    function setWindow(win) {
      const sel = document.getElementById('windowSelect');
      if (!sel) return;
      sel.value = String(win || '24h');
    }
    
    function normalizeMode(x) {
      x = String(x || '').toLowerCase();
      return (x === 'dark' || x === 'light' || x === 'auto') ? x : 'auto';
    }
    
    function systemTheme() {
      return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
        ? 'light'
        : 'dark';
    }
    
    function applyTheme(mode) {
      mode = normalizeMode(mode);
      const resolved = (mode === 'auto') ? systemTheme() : mode;
      
      document.documentElement.dataset.theme = resolved; // drives CSS vars
      setTiles(resolved);                                 // swaps basemap
    
      if (countriesLayer) countriesLayer.setStyle(countryStyle);

      const btn = document.getElementById('themeToggle');
      if (btn) btn.textContent = mode; // show selected mode (auto/dark/light)
    }
    
    function cycleMode(mode) {
      mode = normalizeMode(mode);
      if (mode === 'auto') return 'dark';
      if (mode === 'dark') return 'light';
      return 'auto';
    }
    
    function bindThemeToggle(initialMode) {
      const btn = document.getElementById('themeToggle');
      if (!btn) return;
    
      let mode = normalizeMode(initialMode);
      applyTheme(mode);
    
      btn.addEventListener('click', () => {
        mode = cycleMode(mode);
        localStorage.setItem(THEME_KEY, mode);
        applyTheme(mode);
      });
    
      // live-update when OS theme changes and we're in auto
      const mql = window.matchMedia('(prefers-color-scheme: light)');
      const onChange = () => {
        const saved = normalizeMode(localStorage.getItem(THEME_KEY) || mode);
        if (saved === 'auto') applyTheme('auto');
      };
      if (mql && mql.addEventListener) mql.addEventListener('change', onChange);
      else if (mql && mql.addListener) mql.addListener(onChange);
    }

    const map = L.map('map', {
      zoomControl: false,
      worldCopyJump: false,
      maxBoundsViscosity: 1.0
    }).setView([20, 0], 2);
    
    if (Q.mapOnly) {
      map.dragging.disable();
      map.scrollWheelZoom.disable();
      map.doubleClickZoom.disable();
      map.boxZoom.disable();
      map.keyboard.disable();
      if (map.tap) map.tap.disable();
      map.touchZoom.disable();
    }

    const tiles = {
      dark:  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 18, noWrap: true, bounds: [[-85, -180], [85, 180]]
      }),
      light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 18, noWrap: true, bounds: [[-85, -180], [85, 180]]
      }),
    };
    
    let activeTiles = null;
    function setTiles(kind) {
      if (activeTiles) map.removeLayer(activeTiles);
      activeTiles = tiles[kind] || tiles.dark;
      activeTiles.addTo(map);
    }

    // Clamp panning to one world copy (prevents drifting into repeats)
    const worldBounds = L.latLngBounds(L.latLng(-85, -180), L.latLng(85, 180));
    map.setMaxBounds(worldBounds);
    
    // Dynamically pick a minZoom so the world fills the container width (no grey side bars)
    function updateMinZoomToFillWidth() {
      const w = map.getSize().x;          // container width in px
      const tile = 256;                   // Leaflet base tile size
      const needed = Math.ceil(Math.log2(w / tile)); // zoom where world px >= container px
      const minZ = Math.max(2, needed);   // keep your original floor if you want
      map.setMinZoom(minZ);
    
      if (map.getZoom() < minZ) {
        map.setZoom(minZ, { animate: false });
      }
    }
    
    updateMinZoomToFillWidth();
    map.on('resize', updateMinZoomToFillWidth);
    
    // Country choropleth (underlay)
    let countriesLayer = null;
    let countriesGeo = null;          // GeoJSON FeatureCollection
    let hitsByCountry = {};           // {"US": 123, ...}
    let totalCountryHits = 0;         // total hits across all countries (for %)

    function getCountryCode(props) {
      if (!props) return null;

      // Cover common variants across datasets.
      // The dataset you referenced often uses "ISO3166-1-Alpha-2" or similar.
      const candidates = [
        props.ISO_A2, props.iso_a2,
        props.ISO2, props.iso2,
        props.ISO, props.iso,
        props.ISO3166_1_Alpha_2,
        props.ISO3166_1_ALPHA_2,
        props["ISO3166-1-Alpha-2"],
        props["iso3166-1-alpha-2"],
        props.CNTR_CODE,
        props.country_code,
        props.CountryCode,
        props.ADMIN, // not a code, but fallback debugging
      ];

      for (const c of candidates) {
        if (c && typeof c === 'string' && c.length === 2) return c.toUpperCase();
      }
      return null;
    }

    function clamp01(x) { return Math.max(0, Math.min(1, x)); }
    function lerp(a, b, t) { return a + (b - a) * t; }

    function hexToRgb(hex) {
      const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      if (!m) return [255, 255, 255];
      return [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)];
    }

    function rgbToHex(r, g, b) {
      const toHex = (v) => v.toString(16).padStart(2, '0');
      return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
    }

    function rampColor(t) {
      const c0 = hexToRgb('#e6e9ee'); // light grey
      const c1 = hexToRgb('#69b6ff'); // light blue
      t = clamp01(t);
      const r = Math.round(lerp(c0[0], c1[0], t));
      const g = Math.round(lerp(c0[1], c1[1], t));
      const b = Math.round(lerp(c0[2], c1[2], t));
      return rgbToHex(r, g, b);
    }

    function cssVar(name, fallback) {
      const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return v || fallback;
    }

    function countryStyle(feature) {
      const props = feature.properties || {};
      const code = getCountryCode(props);
      const hits = (code && hitsByCountry[code]) ? Number(hitsByCountry[code]) : 0;

      const maxHits = countryStyle._maxHits || 1;
      const t = Math.log(hits + 1) / Math.log(maxHits + 1);

      // Make it MORE visible so it’s obvious when it’s working
      const active = hits > 0;

      const strokeIdle = cssVar('--country-stroke', '#6b7788');
      const strokeActive = cssVar('--country-stroke-active', '#cfd8e3');
      const fillIdle = cssVar('--country-fill-idle', '#1a2230');
      
      return {
        weight: active ? 1.0 : 0.4,
        opacity: active ? 0.55 : 0.20,
        color: active ? strokeActive : strokeIdle,
        fillOpacity: active ? 0.45 : 0.08,
        fillColor: active ? rampColor(t) : fillIdle
      };
    }

    async function loadCountriesGeoJSON() {
      const url = '/static/countries.geojson';
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) {
        throw new Error(`countries.geojson missing: GET ${url} -> HTTP ${res.status}`);
      }
      const geo = await res.json();
      return geo;
    }

    async function refreshCountryHits() {
      const url = `/data/countries?window=${encodeURIComponent(getWindow())}`;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`GET ${url} -> HTTP ${res.status}`);
      hitsByCountry = await res.json();
    
      let max = 0;
      let total = 0;
    
      for (const k in hitsByCountry) {
        const v = Number(hitsByCountry[k]) || 0;
        if (v > max) max = v;
        total += v;
      }

      totalCountryHits = total;
      countryStyle._maxHits = Math.max(1, max);
      
      if (countriesLayer) countriesLayer.setStyle(countryStyle);
      
      renderHud();
    }

    function formatNumber(n) {
      const x = Number(n) || 0;
      return x.toLocaleString(undefined, { maximumFractionDigits: 0 });
    }
    
    function getCountryName(props) {
      if (!props) return 'Unknown';
      return props.ADMIN || props.name || props.NAME || props.Name || 'Unknown';
    }
    
    function renderHud() {
      if (!getHudEnabled()) return;
    
      const hud = document.getElementById('hud');
      if (!hud) return;
    
      const entries = Object.entries(hitsByCountry || [])
        .map(([cc, v]) => [cc, Number(v) || 0])
        .filter(([, v]) => v > 0)
        .sort((a, b) => b[1] - a[1]);
    
      const top = entries.slice(0, 8);
    
      const topHtml = top.length
        ? `<ol class="toplist">${top.map(([cc, v]) => {
            const pct = totalCountryHits > 0 ? (v / totalCountryHits) * 100 : 0;
            return `<li><span class="muted">${cc}</span> — ${formatNumber(v)} <span class="muted">(${pct.toFixed(1)}%)</span></li>`;
          }).join('')}</ol>`
        : `<div class="muted">No country hits in this window.</div>`;
    
      hud.innerHTML = `
        <div class="row"><div class="muted">Window</div><div>${getWindow()}</div></div>
        <div class="row"><div class="muted">Countries</div><div>${Object.keys(hitsByCountry || {}).length}</div></div>
        <div class="row"><div class="muted">Hits</div><div>${formatNumber(totalCountryHits)}</div></div>
        <div class="sep"></div>
        <div class="muted" style="margin-bottom:4px;">Top countries</div>
        ${topHtml}
      `;
    }

    function tooltipText(feature) {
      const props = feature.properties || {};
      const code = getCountryCode(props);
      const name = getCountryName(props);
    
      const hits = (code && hitsByCountry[code]) ? Number(hitsByCountry[code]) : 0;
      const pct = (totalCountryHits > 0) ? (hits / totalCountryHits) * 100 : 0;
    
      // Only show % if we have totals; keep it clean when 0
      if (hits > 0 && totalCountryHits > 0) {
        return `${name}: ${formatNumber(hits)} (${pct.toFixed(1)}%)`;
      }
      return `${name}: 0`;
    }

    async function ensureCountriesLayer() {
      if (countriesLayer) return;

      countriesGeo = await loadCountriesGeoJSON();

      // quick sanity: show one feature’s property keys to verify our country-code field
      const first = (countriesGeo && countriesGeo.features && countriesGeo.features[0]) ? countriesGeo.features[0] : null;
      const keys = first && first.properties ? Object.keys(first.properties) : [];
      dbg(`countries.geojson loaded. feature0 keys: ${keys.slice(0, 12).join(', ')}${keys.length > 12 ? '…' : ''}`);

      countriesLayer = L.geoJSON(countriesGeo, {
        style: countryStyle,
        onEachFeature: (feature, layer) => {
          layer.bindTooltip(() => tooltipText(feature), {
            sticky: true,        // follows pointer on desktop
            direction: 'auto',
            opacity: 0.95
          });
      
          // Desktop hover highlight
          layer.on('mouseover', () => {
            layer.setStyle({ weight: 1.5, opacity: 0.85 });
            layer.bringToFront();
            layer.openTooltip();
          });
      
          layer.on('mouseout', () => {
            countriesLayer.resetStyle(layer);
            layer.closeTooltip();
          });
      
          // Mobile/Touch: tap to toggle tooltip
          layer.on('click', (e) => {
            // Close any other open tooltips (optional but nice)
            if (countriesLayer && countriesLayer.eachLayer) {
              countriesLayer.eachLayer((l) => {
                if (l !== layer && l.closeTooltip) l.closeTooltip();
              });
            }
      
            // Toggle this one
            const isOpen = layer.isTooltipOpen && layer.isTooltipOpen();
            if (isOpen) {
              layer.closeTooltip();
            } else {
              layer.openTooltip(e.latlng);
            }
          });
        }
      }).addTo(map);
    }

    // City heat layer (overlay)
    const heat = L.heatLayer([], {
      radius: 20,
      blur: 18,
      maxZoom: 6
    }).addTo(map);

    async function getConfig() {
      try {
        const res = await fetch('/config', { cache: 'no-store' });
        return await res.json();
      } catch (_) {
        return { title: "", refresh_seconds: 30 };
      }
    }

    function pointsBounds(pts) {
      // pts is [[lat, lon, weight], ...]
      const latlngs = [];
      for (const p of (pts || [])) {
        const lat = Number(p[0]);
        const lon = Number(p[1]);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
        latlngs.push([lat, lon]);
      }
      if (latlngs.length === 0) return null;
      return L.latLngBounds(latlngs);
    }

    let didInitialFit = false;
    
    async function refreshPoints() {
      const res = await fetch(`/data?window=${encodeURIComponent(getWindow())}`, { cache: 'no-store' });
      const pts = await res.json();
      heat.setLatLngs(pts);
    
      // Fit to where the points actually are (once), so you start zoomed-in.
      if (!didInitialFit) {
        const b = pointsBounds(pts);
        if (b) {
          map.fitBounds(b.pad(0.25), { animate: false });
          didInitialFit = true;
        }
      }
    
      return pts.length || 0;
    }

    async function refreshAll() {
      let countryCount = 0;
      let pointCount = 0;

      // Countries (underlay)
      await ensureCountriesLayer();
      await refreshCountryHits();
      countryCount = Object.keys(hitsByCountry || {}).length;

      // Cities (overlay)
      pointCount = await refreshPoints();

      dbg(`ok. window=${getWindow()}  countries=${countryCount}  points=${pointCount}  maxHits=${countryStyle._maxHits || 1}`);
    }

    (async () => {
      const cfg = await getConfig();
      if (cfg && cfg.title) document.title = cfg.title;

      // cfg.theme_mode should come from backend env var THEME_MODE, default "auto"
      const cfgMode = normalizeMode(cfg && cfg.theme_mode ? cfg.theme_mode : 'auto');
      const rawSaved = localStorage.getItem(THEME_KEY);
      const queryTheme = normalizeMode(Q.theme);
      const initialMode = Q.theme ? queryTheme : (rawSaved ? normalizeMode(rawSaved) : cfgMode);
      
      bindThemeToggle(initialMode);
      
      // Default time window from backend config (env HEATMAP_TIME_WINDOW), override by localStorage
      const defaultWin = (cfg && cfg.time_window) ? String(cfg.time_window) : '24h';
      const rawWin = localStorage.getItem(WINDOW_KEY);
      const queryWin = Q.window ? String(Q.window) : null;

      setWindow(queryWin || rawWin || defaultWin);

      const sel = document.getElementById('windowSelect');
      if (sel) {
        sel.addEventListener('change', async () => {
          localStorage.setItem(WINDOW_KEY, getWindow());
          didInitialFit = false; // optional: refit when changing window
          try { await refreshAll(); } catch (e) { dbg(`ERROR: ${e && e.message ? e.message : String(e)}`); }
        });
      }
      
      try {
        await refreshAll();
      } catch (e) {
        dbg(`ERROR: ${e && e.message ? e.message : String(e)}`);
        throw e;
      }

      const cfgRefresh = Math.max(5, Number(cfg.refresh_seconds || 30));
      const queryRefresh = Q.refresh ? Math.max(5, Number(Q.refresh)) : null;
      const refreshMs = (queryRefresh || cfgRefresh) * 1000;
      setInterval(async () => {
        try {
          await refreshAll();
        } catch (e) {
          dbg(`ERROR: ${e && e.message ? e.message : String(e)}`);
        }
      }, refreshMs);
    })();
  </script>
</body>
</html>
